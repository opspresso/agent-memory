name: Release

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read
  packages: write

# One build per tag.
concurrency:
  group: "release-${{ github.ref_name }}"
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  AWS_ROLE_ARN: arn:aws:iam::396608815058:role/github--agent-memory-ecr
  ECR_REPOSITORY: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/agent-memory

jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    services:
      neo4j:
        image: neo4j:2026.08.1
        env:
          NEO4J_AUTH: neo4j/agent_memory_test
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p agent_memory_test 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_DB: agent_memory_e2e
          POSTGRES_USER: agent_memory
          POSTGRES_PASSWORD: agent_memory
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U agent_memory -d agent_memory_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://agent_memory:agent_memory@127.0.0.1:5433/agent_memory_e2e
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: agent_memory_test
      DOCUMENT_WORKER_ENABLED: "false"
      KNOWLEDGE_EXTRACTION_MODEL: test-extraction
      KNOWLEDGE_EXTRACTION_BASE_URL: http://127.0.0.1:9/v1
      E2E_AUTHENTICATED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Reuse persistent Next.js build cache
        run: |
          cache_dir="${XDG_CACHE_HOME:-$HOME/.cache}/github-actions/${GITHUB_REPOSITORY}/next"
          mkdir -p "$cache_dir" .next
          ln -s "$cache_dir" .next/cache
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:init
      - run: pnpm verify
      - run: pnpm test:integration
      - run: pnpm test:e2e

  github-release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, linux]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          prev="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            notes="$(git log --no-merges --pretty='- %s' "${prev}..${tag}" | grep -v '^- chore: release' || true)"
          else
            notes="$(git log --no-merges --pretty='- %s' "${tag}" | grep -v '^- chore: release' || true)"
          fi
          gh release create "$tag" --title "$tag" --notes "$notes"

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          name: agent-memory
          keep-state: true

      # Attestations off. BuildKit adds a provenance attestation by default, and
      # an attestation is carried as an extra manifest inside an image index.
      # Nothing here consumes the provenance. See
      # docs.docker.com/build/metadata/attestations.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}
            ${{ env.ECR_REPOSITORY }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

  # Its own job so a deploy-trigger failure reads as exactly that — the image
  # is already in ECR and rerunning this job alone redeploys without a rebuild.
  # `needs: release` keeps the ordering the single job had: never point the
  # GitOps repo at a tag whose image does not exist yet.
  gitops:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    # No OIDC here — the only credential is the app installation token below.
    permissions:
      contents: read
    steps:
      # A repository_dispatch to another repository cannot use GITHUB_TOKEN: it
      # is scoped to the repository running the workflow. This mints a
      # short-lived installation token instead, scoped to argocd-env-demo alone,
      # so there is no long-lived PAT to rotate or over-scope.
      #
      # The JWT timestamps come from GitHub's own Date header, not the runner
      # clock: actions/create-github-app-token signs with local time, and a
      # self-hosted runner drifting a minute ahead makes GitHub reject the
      # token with "'exp' is too far in the future" (this broke v0.8.0).
      - name: Mint a token for the GitOps repository
        id: gitops-token
        env:
          CLIENT_ID: ${{ vars.GITOPS_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.GITOPS_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          github_date=$(curl -fsSI https://api.github.com/ | tr -d '\r' \
            | awk -F': ' 'tolower($1)=="date"{print $2}')
          github_now=$(date -u -d "$github_date" +%s)
          header=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
          payload=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' \
            "$((github_now - 60))" "$((github_now + 540))" "$CLIENT_ID" | b64url)
          signature=$(printf '%s.%s' "$header" "$payload" \
            | openssl dgst -sha256 -sign <(printf '%s' "$PRIVATE_KEY") -binary \
            | b64url)
          jwt="$header.$payload.$signature"
          installation_id=$(curl -fsS \
            -H "Authorization: Bearer $jwt" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/opspresso/argocd-env-demo/installation \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          token=$(curl -fsS -X POST \
            -H "Authorization: Bearer $jwt" \
            -H "Accept: application/vnd.github+json" \
            -d '{"repositories":["argocd-env-demo"]}' \
            "https://api.github.com/app/installations/${installation_id}/access_tokens" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      # `phase: alpha` is the deployed one, not a staging step: the ApplicationSet
      # in apps/agent-memory.yaml loads values.yaml + values-alpha.yaml, and
      # `container: app` is the top-level key in that values file — helm.py
      # matches it by name to find the image tag.
      - name: Trigger GitOps 🚀
        env:
          GH_TOKEN: ${{ steps.gitops-token.outputs.token }}
        run: |
          gh api repos/opspresso/argocd-env-demo/dispatches \
            -f event_type=gitops \
            -f client_payload[username]=opspresso \
            -f client_payload[project]=agent-memory \
            -f client_payload[version]="${GITHUB_REF_NAME}" \
            -f client_payload[container]=app \
            -f client_payload[phase]=alpha \
            -f client_payload[type]=helm
