name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    services:
      neo4j:
        image: neo4j:2026.08.1
        env:
          NEO4J_AUTH: neo4j/agent_memory_test
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p agent_memory_test 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_DB: agent_memory_e2e
          POSTGRES_USER: agent_memory
          POSTGRES_PASSWORD: agent_memory
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U agent_memory -d agent_memory_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://agent_memory:agent_memory@127.0.0.1:5433/agent_memory_e2e
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: agent_memory_test
      DOCUMENT_WORKER_ENABLED: "false"
      KNOWLEDGE_EXTRACTION_MODEL: test-extraction
      KNOWLEDGE_EXTRACTION_BASE_URL: http://127.0.0.1:9/v1
      E2E_AUTHENTICATED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:init
      - run: pnpm verify
      - run: pnpm test:integration
      - run: pnpm test:e2e
