name: agent-memory-local

services:
  app:
    build: .
    environment:
      AUTH_PASSWORD: "true"
      AUTH_PASSWORD_SIGNUP: "true"
      BETTER_AUTH_SECRET: agent-memory-local-auth-secret-change-me
      BETTER_AUTH_URL: http://localhost:3100
      DATABASE_URL: postgresql://agent_memory:agent_memory@postgres:5432/agent_memory
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_DB: agent_memory
      POSTGRES_USER: agent_memory
      POSTGRES_PASSWORD: agent_memory
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_memory -d agent_memory"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["objects"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: agent_memory
      MINIO_ROOT_PASSWORD: agent_memory_dev
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
