{{- if not .Values.secrets.existingSecret }}
{{- $authSecret := required "secrets.BETTER_AUTH_SECRET is required when secrets.existingSecret is empty" .Values.secrets.BETTER_AUTH_SECRET }}
{{- $data := dict "BETTER_AUTH_SECRET" $authSecret }}
{{- range $key, $value := omit .Values.secrets "existingSecret" "extra" "BETTER_AUTH_SECRET" }}
{{- if ne (toString $value) "" }}
{{- $_ := set $data $key (toString $value) }}
{{- end }}
{{- end }}
{{- range $key, $value := .Values.secrets.extra }}
{{- $_ := set $data $key (toString $value) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-memory.fullname" . }}-secrets
  labels:
    {{- include "agent-memory.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- if .Values.postgres.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-memory.fullname" . }}-postgres
  labels:
    {{- include "agent-memory.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ include "agent-memory.postgresPassword" . | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s-postgres:5432/%s" .Values.postgres.username (include "agent-memory.postgresPassword" . | urlquery) (include "agent-memory.fullname" .) .Values.postgres.database | quote }}
{{- end }}
{{- if .Values.minio.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-memory.fullname" . }}-minio
  labels:
    {{- include "agent-memory.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  MINIO_ROOT_USER: {{ .Values.minio.rootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ include "agent-memory.minioPassword" . | quote }}
{{- end }}
