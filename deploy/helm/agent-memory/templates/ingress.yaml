{{- if .Values.ingress.enabled }}
{{- $scheme := index .Values.ingress.annotations "alb.ingress.kubernetes.io/scheme" | default "" -}}
{{- if and (eq $scheme "internet-facing") (not .Values.ingress.tls.enabled) -}}
{{- fail "internet-facing ingress requires ingress.tls.enabled=true" -}}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agent-memory.fullname" . }}
  labels:
    {{- include "agent-memory.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      {{- with .Values.ingress.tls.secretName }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "agent-memory.fullname" . }}
                port:
                  name: http
{{- end }}
