image:
  repository: ghcr.io/opspresso/agent-memory
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 1

config:
  BETTER_AUTH_URL: https://memory.opspresso.com
  ADMIN_EMAILS: ""
  ALLOWED_EMAIL_DOMAINS: ""
  AUTH_PASSWORD: "false"
  AUTH_PASSWORD_SIGNUP: "false"
  DOCUMENT_WORKER_ENABLED: "true"
  MIGRATE_ON_START: "true"
  LOG_LEVEL: info
  S3_BUCKET: agent-memory
  S3_REGION: ap-northeast-2
  S3_FORCE_PATH_STYLE: "true"
  EMBEDDING_BASE_URL: ""
  EMBEDDING_MODEL: ""
  KNOWLEDGE_EXTRACTION_BASE_URL: ""
  KNOWLEDGE_EXTRACTION_MODEL: ""
  AI_PROVIDER_MAX_CONCURRENCY: "8"
  AI_PROVIDER_REQUESTS_PER_MINUTE: "120"
  extra: {}

secrets:
  existingSecret: ""
  BETTER_AUTH_SECRET: ""
  METRICS_BEARER_TOKEN: ""
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  OIDC_CLIENT_ID: ""
  OIDC_CLIENT_SECRET: ""
  EMBEDDING_API_KEY: ""
  KNOWLEDGE_EXTRACTION_API_KEY: ""
  DATABASE_URL: ""
  S3_ACCESS_KEY_ID: ""
  S3_SECRET_ACCESS_KEY: ""
  extra: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
  host: memory.opspresso.com
  tls:
    enabled: true
    secretName: ""

terminationGracePeriodSeconds: 45

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 1536Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

postgres:
  enabled: false
  image: pgvector/pgvector:0.8.6-pg18-trixie
  database: agent_memory
  username: agent_memory
  password: ""
  storage:
    className: ""
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

minio:
  enabled: false
  image: minio/minio:RELEASE.2025-09-07T16-13-09Z
  mcImage: minio/mc:RELEASE.2025-08-13T08-35-41Z
  rootUser: agent_memory
  rootPassword: ""
  storage:
    className: ""
    size: 50Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
