name: agent-memory

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  app:
    image: ${AGENT_MEMORY_IMAGE}
    env_file:
      - .env
      - .env.runtime-secrets
      - .env.infrastructure
    environment:
      DOCUMENT_WORKER_ENABLED: "true"
      MIGRATE_ON_START: "true"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging: *logging
    networks:
      data:
      edge:
        aliases:
          - agent-memory
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    env_file:
      - .env.infrastructure
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set shared "$${S3_ENDPOINT}" "$${S3_ACCESS_KEY_ID}" "$${S3_SECRET_ACCESS_KEY}"; do sleep 2; done &&
        mc mb --ignore-existing "shared/$${S3_BUCKET}"
    logging: *logging
    networks:
      - data
    restart: "no"

networks:
  data:
    external: true
    name: ${DATA_NETWORK:-agent-studio_default}
  edge:
    external: true
    name: ${EDGE_NETWORK:-opspresso-edge}
